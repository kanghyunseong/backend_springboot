spring:
  application:
    name: back
  profiles:
    include:
    - private
  
server:
 port: 8081
 
mybatis:
  configuration:
    jdbc-type-for-null: VARCHAR
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.kh.pcar.back.*.model.vo, com.kh.pcar.back.*.model.dto
  mapper-locations: classpath:mapper/**/*.xml