spring:
  application:
    name: back
  profiles:
    include:
      - private
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

logging:
  level:
    com.zaxxer.hikari: DEBUG
server:
 port: 8081
 
